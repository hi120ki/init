[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-added-large-files" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-merge-conflict" },
  { id = "mixed-line-ending" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "oxfmt"
name = "oxfmt"
entry = "npx oxfmt --write"
language = "system"
types_or = ["javascript", "jsx", "ts", "tsx", "css", "json", "markdown", "yaml", "html"]

[[repos.hooks]]
id = "shellcheck"
name = "ShellCheck (system)"
entry = "shellcheck"
language = "system"
files = "\\.(sh|bash)$"
args = ["--severity=warning"]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.43.3"
hooks = [
    { id = "typos" },
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.0"
hooks = [
    { id = "gitleaks" },
]

[[repos]]
repo = "https://github.com/golangci/golangci-lint"
rev = "v2.8.0"
hooks = [
    { id = "golangci-lint", args = ["--timeout=3m"] },
    { id = "golangci-lint-config-verify" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.0"
hooks = [
    { id = "ruff-check" },
    { id = "ruff-format" },
]
