[project]
name = "init"
version = "0.1.0"
description = "Python starter with validated environment configuration and structured JSON logging"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.14.2",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
